<section>
    <h1  id="title" class="text-2xl font-bold text-center mb-4"> "toca al gato!"</h1>
    @if(explode()) {
      <div explosion [class.boom]="explode()">
        <img id="explosion" src="/explosion.png" alt="explosion" class="w-64 mx-auto">
      </div>
    }
    @else {
  <div class="cat-container">
    <div id="cat" (click)="meow()" [class.jumping]="catJumping()" role="button" (keydown.enter)="meow()">
      <img src="/cat.png" alt="Gato" class="w-full h-auto" />
    </div>
  </div>
  <p class="text-center font-italic justify">veces que dijo miau : {{ catCounter() }}</p>
  <audio #meowAudio src="/meow.wav" preload="auto"></audio> 
}
</section>
